[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling-report"
version = "1.1.2"
description = "Report a binned spatial transcriptomics scaling exponent, and what a Poisson test costs at each bin size"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Chaohua Tang", email = "tong@fjmu.edu.cn" },
]
keywords = ["spatial transcriptomics", "Visium HD", "Stereo-seq", "overdispersion",
            "binning", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.22"]


[project.scripts]
scaling-report = "scaling_report.cli:main"

[tool.setuptools]
packages = ["scaling_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
